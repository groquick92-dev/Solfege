name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Autorisations minimales nécessaires au déploiement Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; les nouveaux remplacent ceux en attente.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          # Bascule `base` sur /Solfege/ pour les chemins d'assets.
          GITHUB_PAGES: 'true'

      # GitHub Pages ne connaît pas les routes de l'application : une visite
      # directe sur /cours renverrait une 404. Servir index.html en page
      # d'erreur laisse le routeur reprendre la main côté navigateur.
      - name: Ajouter le repli pour le routage
        run: cp dist/index.html dist/404.html

      # Pages doit avoir été activé une fois à la main dans Settings → Pages,
      # avec la source « GitHub Actions ». Le paramètre `enablement` de cette
      # action ne peut pas s'en charger : créer un site Pages demande un droit
      # d'administration que le jeton d'un workflow n'obtient jamais, même
      # avec la permission `pages: write`.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deployer:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
